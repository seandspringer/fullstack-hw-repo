<!DOCTYPE html>
  <html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>04-form</title>
        <link rel = "stylesheet" href="/css/style.css">
    </head>
    <body>
      <h1 class="title">Submission Results</h1>
      <div id="form">
        <div class="input-container">
            <label class="form-label">Username:</label> 
            <label id="username" class="label-result"></label>
        </div>
        <div class="input-container">
            <label class="form-label">Email:</label> 
            <label id="email" class="label-result"></label>
        </div>
        
        <script>
            window.addEventListener('load', () => {
                const cookies = document.cookie; //eg: email=asdf@asdf.com; username=asdf
                const splitlist = cookies.split(';');
                console.log(splitlist);
                const obj = {
                    email: "",
                    username: ""
                };
                
                splitlist.map((value) => {
                    value = value.trim(); //remove leading and trailing white space
                    console.log(value);
                    if (value.startsWith("email=")) {
                        obj.email = value.split("=")[1];
                    } else if (value.startsWith("username=")) {
                        obj.username = value.split("=")[1];
                    }
                })

                console.log(obj);
                const usernameLabel = document.getElementById("username");
                usernameLabel.textContent = obj.username;

                const emailLabel = document.getElementById("email");
                emailLabel.textContent = obj.email;
            })
        </script>
    </div>
    <body>
  </html>
